name: STATUS check

# Separate from ci.yml so that editing the PR body (to add the exemption line) reruns only
# this check, not the whole build.
on:
  pull_request:
    branches: [develop]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check script cases
        run: .github/scripts/status-check-test.sh
      - name: changed files
        run: git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/changed.txt"
      - name: STATUS.md updated or exempted
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: .github/scripts/status-check.sh "$RUNNER_TEMP/changed.txt"
